  SKRYTÝ ZDROJ ODPOČTU pro oznamovací lištu.

  Proč: platforma rozbaluje %countdown% jen v sekcích „Obsah", v liště ne.

  Ověření po vložení (konzole prohlížeče na libovolné stránce):

  placeholdery nerozbaluje — zkus jiný slot z „Obsah“ (např. Úvodní stránka),
  odpočet pak funguje na stránkách, kde se ten slot renderuje.

  Bez tohoto bloku lišta ukazuje jen text, bez odpočtu (záměrně — jediný
